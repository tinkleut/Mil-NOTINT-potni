<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/style.css">
    <title>Uredi mesečni potni nalog | MIL SISTEMIKA</title>
</head>
<body>
    <header class="login-header">
        <div class="login-brand">
            <div class="header-space">
                <img src="/logo.png" alt="MIL SISTEMIKA logo" class="header-logo">
                <div>
                    <h1>MIL SISTEMIKA</h1>
                    <p>Uredi mesečni potni nalog</p>
                </div>
            </div>
        </div>
    </header>

    <nav class="website-menu" aria-label="Glavni meni">
        <ul>
            <li><a href="/mojiMesecniPotniNalogi">Nazaj</a></li>
            <li><a href="#" id="logoutButton">Odjava</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <section class="travel-order">
            <h2>Uredi mesečni potni nalog <span id="displayId"></span></h2>
            <p>Popravite podatke za mesečni potni nalog.</p>

            <form id="monthlyEditForm">
                <div id="message" class="form-message" role="status" aria-live="polite"></div>

                <div class="form-group">
                    <label for="ime">Ime</label>
                    <input type="text" id="ime" name="ime" required>
                </div>

                <div class="form-group">
                    <label for="priimek">Priimek</label>
                    <input type="text" id="priimek" name="priimek" required>
                </div>

                <div class="form-group">
                    <label for="prebivalisce">Iz prebivališča</label>
                    <input type="text" id="prebivalisce" name="prebivalisce" required>
                </div>

                <div class="form-group">
                    <label for="delovno_mesto">Delovno mesto</label>
                    <input type="text" id="delovno_mesto" name="delovno_mesto" required>
                </div>

                <div class="form-group">
                    <label for="purpose">Namen službene poti</label>
                    <input type="text" id="purpose" name="purpose" required>
                </div>

                <div class="form-group">
                    <label for="departureDate">Mesec in leto mesečnega potnega naloga</label>
                    <input type="date" id="departureDate" name="departureDate" required>
                </div>

                <div class="form-group">
                    <label for="vehicle">Prevozno sredstvo</label>
                    <select id="vehicle" name="vehicle" required>
                        <option value="">-- Izberi prevozno sredstvo --</option>
                        <option value="car">Avto</option>
                        <option value="other">Drugo prevozno sredstvo</option>
                    </select>
                </div>

                <div id="carDetails" class="vehicle-details hidden">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="registerska">Registrska tablica</label>
                            <input type="text" id="registerska" name="registerska">
                        </div>
                        <div class="form-group">
                            <label for="vin">VIN številka</label>
                            <input type="text" id="vin" name="vin">
                        </div>
                    </div>
                </div>

                <div id="otherVehicleDetails" class="vehicle-details hidden">
                    <div class="form-group">
                        <label for="drugo_vozilo">Drugo prevozno sredstvo</label>
                        <input type="text" id="drugo_vozilo" name="drugo_vozilo">
                    </div>
                </div>

                <div class="form-group">
                    <label for="predujem">Plačilo predujema</label>
                    <input type="text" id="predujem" name="predujem" required>
                </div>

                <div class="form-group">
                    <label for="notes">Opombe</label>
                    <textarea id="notes" name="notes" rows="5"></textarea>
                </div>

                <div class="form-group">
                    <label>Obstoječe priloge</label>
                    <div id="travelOrderFiles">Nalaganje prilog...</div>
                </div>

                <div class="form-group">
                    <label for="potni_nalog_datoteke">Dodaj priloge</label>
                    <div class="file-input-row">
                        <input type="file" id="potni_nalog_datoteke" name="potni_nalog_datoteke" multiple>
                        <button type="button" id="clearMonthlyFiles" class="btn-secondary">
                            Počisti
                        </button>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Shrani spremembe</button>
                    <a class="btn btn-secondary" href="/mojiMesecniPotniNalogi">Prekliči</a>
                </div>
            </form>
        </section>
    </main>

    <footer><p><i>© MIL SISTEMIKA d.o.o.</i></p></footer>
    <script src="/JS/auth.js"></script>
    <script src="/JS/urediMesecniPotniNalog.js"></script>
</body>
</html>
