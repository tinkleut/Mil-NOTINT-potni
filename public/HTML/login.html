<!DOCTYPE html>
<html lang="sl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/CSS/style.css">

    <title>Prijava | MIL SISTEMIKA</title>
</head>

<body>

    <header class="login-header">

        <div class="login-brand">
            <div class="header-space">
                <div>
                    <img
                    src="/logo.png"
                    alt="MIL SISTEMIKA logo"
                    class="header-logo"
                    >
                </div>

                <div>
                    <h1>MIL SISTEMIKA</h1>
                    <p>Potni nalogi</p>
                </div>
                
            </div>
        </div>

    </header>


    <main class="login-main">

        <section class="login-card">

            <div class="login-card-header">

                <div class="login-icon">
                    🔒
                </div>

                <div>
                    <h2>Prijava v sistem</h2>
                    <p>Vnesite svoje uporabniške podatke.</p>
                </div>

            </div>


            <div class="security-notice">
                <strong>ZAŠČITEN DOSTOP</strong>
                <span>•</span>
                <span>Samo za pooblaščene uporabnike</span>
            </div>


            <form id="loginForm">
                
                <div class="form-group">
                    <label for="username">Uporabniško ime</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Vnesite uporabniško ime"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Geslo</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Vnesite geslo"
                        required
                    >
                </div>

                <button type="submit" class="login-button">PRIJAVA V SISTEM</button>
                <p id="message" class="login-message"></p>
            </form>


            <div class="system-status">

                <span class="status-indicator"></span>

                <span>SISTEM DELUJE</span>

            </div>

        </section>

    </main>


    <footer class="login-footer">

        <p>
            <i>© MIL SISTEMIKA d.o.o.</i>
        </p>

        <p>
           erni informacijski sistem
        </p>

    </footer>


    <script src="/JS/auth.js"></script>

</body>

</html>
