<!DOCTYPE html>
<html lang="sl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/style.css">
    <title>Mesečni obračun | MIL SISTEMIKA</title>
</head>

<body>
    <header class="login-header">
        <div class="login-brand">
            <div class="header-space">
                <div>
                    <img src="/logo.png" alt="MIL SISTEMIKA logo" class="header-logo">
                </div>
                <div>
                    <h1>MIL SISTEMIKA</h1>
                    <p>Mesečni obračun</p>
                </div>
            </div>
        </div>
    </header>

    <nav class="website-menu">
        <ul>
            <li><a href="/admin">Nazaj na domačo stran</a></li>
            <li><a href="#" id="logoutButton">Odjava</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <section class="travel-order">
            <h1 style="text-align: center;">Mesečni obračun</h1>
            <p class="page-description" style="text-align: center;">
                Mesečni potni nalogi, ki so aktivni ali še niso plačani.
            </p>

            <div id="message" class="message" style="display: none;"></div>
            <div id="monthlyCalculations" class="travel-orders"></div>

            <div id="noMonthlyCalculations" class="no-travel-orders" style="display: none;">
                <h3>Ni mesečnih obračunov</h3>
                <p>Trenutno ni aktivnih ali neplačanih mesečnih potnih nalogov.</p>
            </div>
        </section>
    </main>

    <footer>
        <p><i>© MIL SISTEMIKA d.o.o.</i></p>
    </footer>

    <script src="/adminJS/mesecniObracun.js"></script>
    <script src="/JS/auth.js"></script>
</body>

</html>
