<!DOCTYPE html>
<html lang="sl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/style.css">
    <title>Nov mesečni potni nalog | MIL SISTEMIKA</title>
</head>

<body>

    <header class="login-header">
        <div class="login-brand">
            <div class="header-space">
                <div>
                    <img src="/logo.png" alt="MIL SISTEMIKA logo" class="header-logo">
                </div>
                <div>
                    <h1>MIL SISTEMIKA</h1>
                    <p>Administracija potnih nalogov</p>
                </div>
            </div>
        </div>
    </header>

    <nav class="website-menu">
        <ul>
            <li><a href="/admin">Nazaj na domačo stran</a></li>
            <li><a href="#" id="logoutButton">Odjava</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <section class="travel-order">
            <h2>Nov mesečni potni nalog</h2>
            <p>Izberite zaposlenega in izpolnite podatke za mesečni potni nalog.</p>

            <form id="monthlyTravelOrderForm" action="#" method="post">
                <div id="message" class="form-message" role="status" aria-live="polite"></div>

                <div class="form-group">
                    <label for="user_id">Zaposleni</label>
                    <select id="user_id" name="user_id" required>
                        <option value="">-- Izberi zaposlenega --</option>
                        <!-- Zaposleni se bodo naložili s JavaScriptom. -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="ime">Ime</label>
                    <input type="text" id="ime" name="ime" placeholder="Ime" required>
                </div>

                <div class="form-group">
                    <label for="priimek">Priimek</label>
                    <input type="text" id="priimek" name="priimek" placeholder="Priimek" required>
                </div>

                <div class="form-group">
                    <label for="prebivalisce">Prebivališče</label>
                    <input type="text" id="prebivalisce" name="prebivalisce" placeholder="Naslov" required>
                </div>

                <div class="form-group">
                    <label for="delovno_mesto">Delovno mesto</label>
                    <input type="text" id="delovno_mesto" name="delovno_mesto" placeholder="Delovno mesto" required>
                </div>

                <div class="form-group">
                    <label for="purpose">Namen službene poti</label>
                    <input type="text" id="purpose" name="purpose" placeholder="Npr. sestanek, izobraževanje..." required>
                </div>

                <div class="form-group">
                    <label for="departureDate">Mesec in leto mesečnega potnega naloga</label>
                    <input type="date" id="departureDate" name="departureDate" value="2026-09-15" required>
                </div>

                <div class="form-group">
                    <label for="vehicle">Prevozno sredstvo</label>
                    <select id="vehicle" name="vehicle" required>
                        <option value="">-- Izberi prevozno sredstvo --</option>
                        <option value="car">Avto</option>
                        <option value="other">Drugo prevozno sredstvo</option>
                    </select>
                </div>

                <div id="carDetails" class="vehicle-details hidden">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="registerska">Registrska tablica</label>
                            <input type="text" id="registerska" name="registerska" readonly>
                        </div>

                        <div class="form-group">
                            <label for="vin">VIN številka</label>
                            <input type="text" id="vin" name="vin" readonly>
                        </div>
                    </div>
                </div>

                <div id="otherVehicleDetails" class="vehicle-details hidden">
                    <div class="form-group">
                        <label for="drugo_vozilo">Drugo prevozno sredstvo</label>
                        <input type="text" id="drugo_vozilo" name="drugo_vozilo" placeholder="Npr. vlak, avtobus, taxi...">
                    </div>
                </div>

                <div class="form-group">
                    <label for="predujem">Plačilo predujema</label>
                    <input type="text" id="predujem" name="predujem" placeholder="Da/Ne, v znesku:" required>
                </div>

                <div class="form-group">
                    <label for="opombe">Opombe</label>
                    <textarea id="opombe" name="opombe" rows="5" placeholder="Dodatne opombe"></textarea>
                </div>

                <div class="form-group">
                    <label for="potni_nalog_datoteke">Priloge k potnemu nalogu</label>

                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input
                            type="file"
                            id="potni_nalog_datoteke"
                            name="potni_nalog_datoteke"
                            multiple
                        >

                        <button type="button" id="pobrisi_datoteke">
                            Počisti
                        </button>
                    </div>
                </div>

                <script>
                    document.getElementById('pobrisi_datoteke').addEventListener('click', function () {
                        document.getElementById('potni_nalog_datoteke').value = '';
                    });
                </script>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Ustvari mesečni potni nalog</button>
                    <a class="btn btn-secondary" href="/admin">Prekliči</a>
                </div>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p><i>© MIL SISTEMIKA d.o.o.</i></p>
    </footer>

    <script src="/JS/auth.js"></script>
    <script src="/adminJS/novMesecniPotniNalog.js"></script>
</body>

</html>
